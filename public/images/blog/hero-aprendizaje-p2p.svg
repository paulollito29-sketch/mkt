<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Glowing orbs -->
  <circle cx="200" cy="150" r="180" fill="#4F46E5" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="220" fill="#06B6D4" opacity="0.2" filter="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Central Visual Container -->
  <g transform="translate(100, 75)">
    <!-- Main Card Backdrop -->
    <rect width="1000" height="525" rx="24" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Top Badge -->
    <rect x="50" y="45" width="220" height="36" rx="18" fill="rgba(79, 70, 229, 0.2)" stroke="#6366F1" stroke-width="1.5"/>
    <text x="70" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#A5B4FC" letter-spacing="1">
      MINDFIX • APRENDIZAJE P2P
    </text>

    <!-- Main Title Graphic -->
    <text x="50" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      ¿Por qué un compañero te explica
    </text>
    <text x="50" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-1">
      mejor que el profesor?
    </text>

    <!-- Subtitle -->
    <text x="50" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#9CA3AF">
      La neurociencia del lenguaje horizontal, la superación de la maldición del conocimiento y las tutorías entre pares.
    </text>

    <!-- Interactive Concept Graphics (2 Students Collab Box) -->
    <g transform="translate(50, 290)">
      <!-- Left Box: Student A -->
      <rect width="270" height="180" rx="16" fill="rgba(31,41,55,0.6)" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="22" fill="#4F46E5"/>
      <text x="50" y="56" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#fff" font-size="16">A</text>
      <text x="90" y="46" font-family="sans-serif" font-weight="700" fill="#fff" font-size="16">Estudiante Aprendiz</text>
      <text x="90" y="66" font-family="sans-serif" fill="#A5B4FC" font-size="12">Detecta vacíos con IA</text>
      <text x="25" y="115" font-family="sans-serif" fill="#D1D5DB" font-size="13">• Cero vergüenza al preguntar</text>
      <text x="25" y="140" font-family="sans-serif" fill="#D1D5DB" font-size="13">• Resolución de parciales pasados</text>
      <text x="25" y="165" font-family="sans-serif" fill="#10B981" font-size="12" font-weight="600">Rumbo al Tercio Superior</text>

      <!-- Center Connector -->
      <g transform="translate(290, 75)">
        <circle cx="20" cy="15" r="18" fill="#06B6D4" opacity="0.2"/>
        <path d="M 5 15 L 35 15 M 25 7 L 35 15 L 25 23" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="45" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#06B6D4">P2P</text>
      </g>

      <!-- Right Box: Student B -->
      <g transform="translate(350, 0)">
        <rect width="270" height="180" rx="16" fill="rgba(31,41,55,0.6)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="22" fill="#06B6D4"/>
        <text x="50" y="56" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#fff" font-size="16">B</text>
        <text x="90" y="46" font-family="sans-serif" font-weight="700" fill="#fff" font-size="16">Estudiante Tutor</text>
        <text x="90" y="66" font-family="sans-serif" fill="#67E8F9" font-size="12">Aprobó con nota sobresaliente</text>
        <text x="25" y="115" font-family="sans-serif" fill="#D1D5DB" font-size="13">• Lenguaje horizontal y directo</text>
        <text x="25" y="140" font-family="sans-serif" fill="#D1D5DB" font-size="13">• Aplica el 'Efecto Protegé'</text>
        <text x="25" y="165" font-family="sans-serif" fill="#6366F1" font-size="12" font-weight="600">Consolidación de Maestría</text>
      </g>

      <!-- Value Metric Pill -->
      <g transform="translate(645, 25)">
        <rect width="240" height="130" rx="14" fill="rgba(79,70,229,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
        <text x="25" y="40" font-family="sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">+84%</text>
        <text x="25" y="65" font-family="sans-serif" font-size="13" font-weight="600" fill="#A5B4FC">Retención de Conceptos</text>
        <text x="25" y="95" font-family="sans-serif" font-size="12" fill="#9CA3AF">Al aprender con metodología colaborativa de pares activos.</text>
      </g>
    </g>
  </g>
</svg>
